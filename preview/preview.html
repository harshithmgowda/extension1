<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatNotes — Document Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="preview.css">
  <link id="templateStyleLink" rel="stylesheet" href="../templates/academic.css">
</head>
<body>
  <div class="mac-app">
    <!-- Top macOS Navigation & Action Bar -->
    <header class="mac-titlebar">
      <div class="titlebar-left">
        <div class="window-controls">
          <span class="win-dot close" title="Close Studio"></span>
          <span class="win-dot minimize" title="Minimize"></span>
          <span class="win-dot maximize" title="Zoom"></span>
        </div>
        <div class="doc-identity">
          <span class="doc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </span>
          <span id="docTitleDisplay" class="doc-title-text">Untitled Notes</span>
          <span id="docMetaDisplay" class="doc-meta-badge">0 words</span>
        </div>
      </div>

      <!-- Quick Export Actions in Titlebar -->
      <div class="titlebar-actions">
        <button id="exportMdBtn" class="btn-toolbar" title="Export as Markdown (.md)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 3px;">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          <span>Markdown</span>
        </button>
        <button id="exportHtmlBtn" class="btn-toolbar" title="Export self-contained HTML (.html)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 3px;">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span>HTML</span>
        </button>
        <button id="exportDocxBtn" class="btn-toolbar" title="Export as Word document (.docx)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 3px;">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Word (.docx)</span>
        </button>
        <button id="exportPdfBtn" class="btn-toolbar btn-primary-apple" title="Download exact vector PDF document (.pdf)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download PDF</span>
        </button>
        <button id="printDocBtn" class="btn-toolbar" title="Print document to printer or system PDF (Ctrl+P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width: 13px; height: 13px; vertical-align: middle; margin-right: 3px;">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          <span>Print</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="workspace-body">
      <!-- Left Sidebar: Apple Inspector -->
      <aside class="sidebar-inspector">
        <div class="inspector-scroll">
          <!-- 1. Document Format Mode -->
          <div class="inspector-group">
            <label class="group-title">Structure</label>
            <div class="apple-segmented">
              <button class="seg-item active" data-mode="study">Study</button>
              <button class="seg-item" data-mode="exact">Exact</button>
              <button class="seg-item" data-mode="compact">Compact</button>
            </div>
          </div>

          <!-- 2. Templates (12 Themes) -->
          <div class="inspector-group">
            <label class="group-title">Theme</label>
            <div class="template-shelf">
              <button class="theme-pill active" data-template="academic">
                <span class="theme-swatch academic"></span>
                <span>Academic</span>
              </button>
              <button class="theme-pill" data-template="minimal">
                <span class="theme-swatch minimal"></span>
                <span>Minimal</span>
              </button>
              <button class="theme-pill" data-template="developer">
                <span class="theme-swatch developer"></span>
                <span>Developer</span>
              </button>
              <button class="theme-pill" data-template="premium">
                <span class="theme-swatch premium"></span>
                <span>Premium</span>
              </button>
              <button class="theme-pill" data-template="notebook">
                <span class="theme-swatch notebook"></span>
                <span>Notebook</span>
              </button>
              <button class="theme-pill" data-template="dark">
                <span class="theme-swatch dark"></span>
                <span>Dark</span>
              </button>
              <button class="theme-pill" data-template="editorial">
                <span class="theme-swatch editorial"></span>
                <span>Editorial</span>
              </button>
              <button class="theme-pill" data-template="cyberpunk">
                <span class="theme-swatch cyberpunk"></span>
                <span>Cyberpunk</span>
              </button>
              <button class="theme-pill" data-template="nordic">
                <span class="theme-swatch nordic"></span>
                <span>Nordic</span>
              </button>
              <button class="theme-pill" data-template="notion">
                <span class="theme-swatch notion"></span>
                <span>Notion</span>
              </button>
              <button class="theme-pill" data-template="solarized">
                <span class="theme-swatch solarized"></span>
                <span>Solarized</span>
              </button>
              <button class="theme-pill" data-template="cornell">
                <span class="theme-swatch cornell"></span>
                <span>Cornell</span>
              </button>
            </div>
          </div>

          <!-- 3. Typography -->
          <div class="inspector-group">
            <label class="group-title">Typography</label>
            <div class="row-control">
              <span class="label-text">Font</span>
              <select id="fontFamilySelect" class="apple-select">
                <option value="Inter">San Francisco / Inter</option>
                <option value="Georgia">Georgia</option>
                <option value="Playfair Display">Playfair Display (Editorial)</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Roboto">Roboto</option>
                <option value="Poppins">Poppins</option>
                <option value="Arial">Helvetica / Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="JetBrains Mono">JetBrains Mono</option>
                <option value="Fira Code">Fira Code (Monospace)</option>
              </select>
            </div>

            <div class="row-control">
              <div class="label-between">
                <span class="label-text">Size</span>
                <span id="fontSizeVal" class="value-text">14 pt</span>
              </div>
              <input type="range" id="fontSizeInput" min="11" max="18" value="14" class="apple-slider">
            </div>
          </div>

          <!-- 4. Page Setup -->
          <div class="inspector-group">
            <label class="group-title">Page Setup</label>
            <div class="grid-pair">
              <div class="col-control">
                <span class="label-text">Paper</span>
                <select id="pageSizeSelect" class="apple-select">
                  <option value="A4">A4</option>
                  <option value="Letter">US Letter</option>
                  <option value="A5">A5</option>
                </select>
              </div>
              <div class="col-control">
                <span class="label-text">Orientation</span>
                <select id="orientationSelect" class="apple-select">
                  <option value="portrait">Portrait</option>
                  <option value="landscape">Landscape</option>
                </select>
              </div>
            </div>

            <div class="grid-pair">
              <div class="col-control">
                <span class="label-text">Margins</span>
                <select id="marginsSelect" class="apple-select">
                  <option value="small">Narrow</option>
                  <option value="normal" selected>Normal</option>
                  <option value="large">Wide</option>
                </select>
              </div>
              <div class="col-control">
                <span class="label-text">Border</span>
                <select id="borderStyleSelect" class="apple-select">
                  <option value="simple" selected>Simple</option>
                  <option value="none">None</option>
                  <option value="rounded">Rounded</option>
                  <option value="double">Double</option>
                  <option value="notebook">Notebook</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 5. Headers & Footers -->
          <div class="inspector-group">
            <label class="group-title">Header & Footer</label>
            <div class="grid-pair">
              <div class="col-control">
                <span class="label-text">Header</span>
                <select id="headerStyleSelect" class="apple-select">
                  <option value="title" selected>Document Title</option>
                  <option value="none">None</option>
                </select>
              </div>
              <div class="col-control">
                <span class="label-text">Footer</span>
                <select id="footerStyleSelect" class="apple-select">
                  <option value="page-numbers" selected>Page Numbers</option>
                  <option value="title">Document Title</option>
                  <option value="none">None</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 6. Accent Color -->
          <div class="inspector-group">
            <label class="group-title">Accent Tint</label>
            <div class="color-row">
              <button class="color-dot active" data-color="#0071e3" style="background: #0071e3;"></button>
              <button class="color-dot" data-color="#34c759" style="background: #34c759;"></button>
              <button class="color-dot" data-color="#ff9500" style="background: #ff9500;"></button>
              <button class="color-dot" data-color="#ff2d55" style="background: #ff2d55;"></button>
              <button class="color-dot" data-color="#af52de" style="background: #af52de;"></button>
              <button class="color-dot" data-color="#5856d6" style="background: #5856d6;"></button>
              <input type="color" id="customColorPicker" value="#0071e3" class="apple-color-input" title="Custom Color">
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Document Stage -->
      <main class="document-stage">
        <div class="canvas-scroll">
          <div id="paperSheet" class="paper-sheet size-a4 orientation-portrait border-simple">
            <article id="documentContent" class="chatnotes-document template-academic">
              <!-- Dynamically populated document -->
            </article>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="chatnotesToast" class="chatnotes-toast"></div>

  <!-- Core Scripts -->
  <script src="../core/parser.js"></script>
  <script src="../core/formatter.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../core/highlighter.js"></script>
  <script src="../export/markdown.js"></script>
  <script src="../export/html.js"></script>
  <script src="../export/pdf.js"></script>
  <script src="../export/docx.js"></script>
  <script src="preview.js"></script>
</body>
</html>
