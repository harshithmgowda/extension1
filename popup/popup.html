<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatNotes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-window">
    <!-- Header -->
    <header class="app-header">
      <div class="app-brand">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <line x1="10" y1="9" x2="8" y2="9"></line>
          </svg>
        </div>
        <div class="brand-info">
          <span class="app-name">ChatNotes</span>
          <span class="app-caption">Conversation to Notes</span>
        </div>
      </div>

      <div id="tabStatusBadge" class="status-pill checking">
        <span class="status-indicator"></span>
        <span id="tabStatusText" class="status-label">Checking</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-body">
      <!-- Active Document Card -->
      <section id="stateCard" class="card state-panel">
        <div class="state-icon-box">
          <svg id="stateIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="state-details">
          <h2 id="stateTitle" class="state-heading">Looking for ChatGPT</h2>
          <p id="stateDesc" class="state-sub">Open a conversation tab on chatgpt.com to extract.</p>
        </div>
      </section>

      <!-- Primary Actions -->
      <section class="actions-group">
        <button id="extractBtn" class="btn btn-primary" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span id="extractBtnText">Extract to Notes</span>
        </button>

        <button id="previewBtn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span>Open Studio</span>
        </button>
      </section>

      <!-- Formats Bar -->
      <section class="formats-bar">
        <span class="formats-label">Formats</span>
        <div class="format-pills">
          <span class="format-pill">PDF</span>
          <span class="format-pill">Word</span>
          <span class="format-pill">Markdown</span>
          <span class="format-pill">HTML</span>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="privacy-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>100% on-device &bull; Private</span>
      </div>
      <span class="version-label">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
